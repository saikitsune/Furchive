name: Rust rewrite qualification
on:
  push:
    branches: [rewrite/rust]
    paths: ['rust/**', '.github/workflows/rust-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: furchive-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  downloads:
    name: Download contracts ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 3
      RUSTUP_AUTO_INSTALL: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve exact source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify native transcript guard
        run: python rust/crates/furchive-downloads/scripts/test_native_check.py -v
      - name: Exercise actual native download contracts
        run: python rust/crates/furchive-downloads/scripts/native_check.py
      - name: Verify checkout stayed unchanged
        run: git diff --exit-code HEAD -- rust/crates/furchive-downloads rust/crates/furchive-domain
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: download-contracts-${{ runner.os }}
          retention-days: 5
          if-no-files-found: error
          path: |
            rust/crates/furchive-downloads/contracts/source-manifest.json
            rust/crates/furchive-downloads/contracts/test-inventory.json
            rust/crates/furchive-downloads/test-artifacts/native-*/*.json
            rust/crates/furchive-downloads/test-artifacts/native-*/*.log
  vault:
    name: Native vault ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Native vault receipt guard
        run: python rust/scripts/native-vault-test.py -v
      - name: Compile isolated native vault probe
        run: cargo +1.99.1 build --manifest-path rust/Cargo.toml -p furchive-app --example native_vault_probe --features native-vault-test --locked
      - name: Private Linux Secret Service prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11 libglib2.0-bin
      - name: Exercise isolated real Secret Service
        if: runner.os == 'Linux'
        run: dbus-run-session -- python rust/scripts/native-vault-linux.py rust/target/debug/examples/native_vault_probe --output rust/test-artifacts/native-vault-Linux
      - name: Exercise real Windows Credential Manager
        if: runner.os == 'Windows'
        run: python rust/scripts/native-vault-run.py rust/target/debug/examples/native_vault_probe.exe --output rust/test-artifacts/native-vault-Windows
      - name: Exercise real macOS Keychain
        if: runner.os == 'macOS'
        run: python rust/scripts/native-vault-run.py rust/target/debug/examples/native_vault_probe --output rust/test-artifacts/native-vault-macOS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: native-vault-${{ runner.os }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            rust/test-artifacts/native-vault-*/*.json
            rust/test-artifacts/native-vault-*/*.log
            rust/test-artifacts/native-vault-*/receipts/*.json
            rust/test-artifacts/native-vault-*/receipts/*.log
  native:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 3
      RUSTUP_AUTO_INSTALL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Required native resources
        run: python rust/scripts/test-platform-assets.py
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev xvfb xauth dbus-x11 xdotool openbox gstreamer1.0-libav gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gnome-keyring libglib2.0-bin
      - name: Core contracts and quality
        run: |
          cargo +1.99.1 test --manifest-path rust/Cargo.toml --workspace --all-features --locked
          cargo +1.99.1 fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo +1.99.1 clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
          cargo +1.99.1 test --manifest-path rust/crates/furchive-catalog/Cargo.toml --locked
      - name: Frontend quality and production build
        run: |
          npm ci --prefix rust/apps/desktop
          npm run --prefix rust/apps/desktop check
          npm test --prefix rust/apps/desktop
          npm run --prefix rust/apps/desktop test:components
          npm run --prefix rust/apps/desktop build
      - name: Native default and qualification quality
        run: |
          cargo +1.99.1 clippy --manifest-path rust/apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.99.1 test --manifest-path rust/apps/desktop/src-tauri/Cargo.toml --all-features --locked
          cargo +1.99.1 clippy --manifest-path rust/apps/desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo +1.99.1 build --manifest-path rust/apps/desktop/src-tauri/Cargo.toml --features self-test,custom-protocol --locked
      - name: Exercise native WebKitGTK
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 rust/scripts/run-native-qualification.py rust/apps/desktop/src-tauri/target/debug/furchive-desktop --output rust/test-artifacts/ci-native-${{ runner.os }}.json
      - name: Exercise native WebView2
        if: runner.os == 'Windows'
        run: python rust/scripts/run-native-qualification.py rust/apps/desktop/src-tauri/target/debug/furchive-desktop.exe --output rust/test-artifacts/ci-native-${{ runner.os }}.json
      - name: Exercise native WKWebView
        if: runner.os == 'macOS'
        run: python3 rust/scripts/run-native-qualification.py rust/apps/desktop/src-tauri/target/debug/furchive-desktop --output rust/test-artifacts/ci-native-${{ runner.os }}.json
      - name: Isolated native capture dependencies
        run: |
          python -m venv rust/test-artifacts/capture-env
          if [ "$RUNNER_OS" = "Windows" ]; then P="$PWD/rust/test-artifacts/capture-env/Scripts"; else P="$PWD/rust/test-artifacts/capture-env/bin"; fi
          "$P/python" -m pip install pillow==12.0.0 mss==10.1.0
          if [ "$RUNNER_OS" = "macOS" ]; then "$P/python" -m pip install pyobjc-framework-Quartz==12.0; fi
          printf '%s\n' "$P" >> "$GITHUB_PATH"
      - name: Package layout contracts
        run: |
          python rust/scripts/test-package-qualification.py -v
          python rust/scripts/browse-test-native.py -v
          python rust/scripts/account-ui-test.py -v
      - name: Build native protected-store account readback probe
        run: cargo +1.99.1 build --manifest-path rust/Cargo.toml -p furchive-app --example native_vault_probe --features native-vault-test --locked
      - name: Build Debian qualification payload
        if: runner.os == 'Linux'
        working-directory: rust/apps/desktop
        run: npm run tauri -- build --debug --features self-test --bundles deb --ci -- --locked
      - name: Build unsigned macOS qualification app
        if: runner.os == 'macOS'
        working-directory: rust/apps/desktop
        run: npm run tauri -- build --debug --features self-test --bundles app --ci --no-sign -- --locked
      - name: Exercise extracted Debian payload
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash -c 'openbox > rust/test-artifacts/openbox.log 2>&1 & WM=$!; trap "kill $WM 2>/dev/null || true" EXIT; python rust/scripts/qualify-package.py --media-campaign --account-probe rust/target/debug/examples/native_vault_probe --output rust/test-artifacts/package-Linux'
      - name: Exercise extracted portable Windows payload
        if: runner.os == 'Windows'
        run: python rust/scripts/qualify-package.py --media-campaign --account-probe rust/target/debug/examples/native_vault_probe.exe --output rust/test-artifacts/package-${{ runner.os }}
      - name: Exercise extracted macOS app payload
        if: runner.os == 'macOS'
        run: python3 rust/scripts/qualify-package.py --media-campaign --account-probe rust/target/debug/examples/native_vault_probe --output rust/test-artifacts/package-${{ runner.os }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: native-qualification-${{ runner.os }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            rust/test-artifacts/ci-native-*.json
            rust/test-artifacts/ci-native-*.log
            rust/test-artifacts/package-*/package.json
            rust/test-artifacts/package-*/campaigns.json
            rust/test-artifacts/package-*/native.json
            rust/test-artifacts/package-*/native.log
            rust/test-artifacts/package-*/*.deb
            rust/test-artifacts/package-*/*.zip
            rust/test-artifacts/package-*/*.tar.gz
            rust/test-artifacts/package-*/media/*.json
            rust/test-artifacts/package-*/media/*.png
            rust/test-artifacts/package-*/media/*.log
            rust/test-artifacts/package-*/browse/*.json
            rust/test-artifacts/package-*/browse/*.log
            rust/test-artifacts/package-*/account/*.json
            rust/test-artifacts/package-*/account/*.log
            rust/test-artifacts/package-*/account/receipts/*.json
            rust/test-artifacts/package-*/account/receipts/*.log
