[package]
name="furchive-app"
version="0.1.0"
edition="2024"
publish=false
[dependencies]
serde_json="1"
keyring-core="1.0.1"
serde={version="1",features=["derive"]}
tempfile="3"
rusqlite={version="0.37",features=["bundled","limits","hooks"]}
sha2="0.10"
furchive-domain={path="../furchive-domain"}
furchive-engine={path="../furchive-engine"}
furchive-e621={path="../furchive-e621"}
tokio={version="1",features=["sync","rt-multi-thread","macros"]}
[target.'cfg(target_os="linux")'.dependencies]
zbus-secret-service-keyring-store={version="1.0.1",features=["crypto-rust"]}
[target.'cfg(target_os="windows")'.dependencies]
windows-native-keyring-store={version="1.1.0",default-features=false}
[target.'cfg(target_os="macos")'.dependencies]
apple-native-keyring-store={version="1.0.2",features=["keychain"]}
[dev-dependencies]
