[package]
name="furchive-app"
version="0.1.0"
edition="2024"
publish=false
[features]
native-vault-test=[]
cache-test-contract=[]
fixture-media=["furchive-e621/fixture-api"]
fixture-downloads=["furchive-downloads/fixture-http"]
[dependencies]
serde_json="1"
reqwest={version="0.13",default-features=false,features=["rustls"]}
url="2"
getrandom="0.4"
image={version="0.25",default-features=false,features=["png","jpeg","gif","webp"]}
keyring-core="1.0.1"
serde={version="1",features=["derive"]}
tempfile="3"
rusqlite={version="0.37",features=["bundled","limits","hooks"]}
sha2="0.10"
furchive-domain={path="../furchive-domain"}
furchive-engine={path="../furchive-engine"}
furchive-e621={path="../furchive-e621"}
furchive-downloads={path="../furchive-downloads"}
tokio={version="1",features=["sync","rt-multi-thread","macros"]}
[target.'cfg(target_os="linux")'.dependencies]
zbus-secret-service-keyring-store={version="1.0.1",features=["crypto-rust"]}
[target.'cfg(target_os="windows")'.dependencies]
windows-native-keyring-store={version="1.1.0",default-features=false}
[target.'cfg(target_os="macos")'.dependencies]
apple-native-keyring-store={version="1.0.2",features=["keychain"]}
[[example]]
name="native_vault_probe"
required-features=["native-vault-test"]
[dev-dependencies]
