[package]
name = "furchive-downloads"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Durable, capability-confined Furchive download worker"

# Intentionally isolated until the integrating owner adds this to the workspace.
[workspace]
resolver = "2"

[features]
fixture-http=[]
[dependencies]
furchive-domain = { path = "../furchive-domain" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
md-5 = "0.10"
url = "2"
httpdate = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
