[package]
name = "furchive-desktop"
version = "2.0.0-alpha.1"
edition = "2024"
publish = false
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
furchive-domain = {path="../../../crates/furchive-domain"}
furchive-engine = {path="../../../crates/furchive-engine"}
furchive-e621 = {path="../../../crates/furchive-e621"}
furchive-app = {path="../../../crates/furchive-app"}
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
[features]
custom-protocol = ["tauri/custom-protocol"]
self-test = ["furchive-e621/fixture-api","furchive-app/fixture-media"]
cache-test-contract = ["furchive-app/cache-test-contract"]
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSView", "NSResponder", "NSWindow"] }
